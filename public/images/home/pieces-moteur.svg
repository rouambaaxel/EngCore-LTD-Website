<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Piston · bielle · chemise">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#e3e3ec" stroke-width="1"/>
    </pattern>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#a8a7bd" stroke-width="1"/>
    </pattern>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#ffae29"/>
    </marker>
  </defs>
  <rect width="480" height="300" fill="#f7f7fa"/>
  <rect width="480" height="300" fill="url(#grid)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- chemise, coupe : paroi hachurée de part et d'autre de l'alésage -->
    <rect x="150" y="30" width="16" height="150" fill="url(#hatch)" stroke="#242249" stroke-width="1.2"/>
    <rect x="304" y="30" width="16" height="150" fill="url(#hatch)" stroke="#242249" stroke-width="1.2"/>
    <path d="M166 30v150M304 30v150" stroke="#242249" stroke-width="2.2"/>
    <!-- chambre de combustion -->
    <path d="M166 42h138" stroke="#5b5a7d" stroke-width="0.9" stroke-dasharray="5 4"/>
    <!-- piston -->
    <rect x="168" y="62" width="134" height="72" rx="3" fill="#f7f7fa" stroke="#242249" stroke-width="2.2"/>
    <path d="M174 74h122M174 84h122M174 94h122" stroke="#242249" stroke-width="1.2"/>
    <text x="326" y="82" font-family="ui-monospace, monospace" font-size="10" fill="#5b5a7d">segments</text>
    <path d="M300 78h22" stroke="#5b5a7d" stroke-width="0.9"/>
    <!-- axe de piston -->
    <circle cx="235" cy="116" r="13" fill="#f7f7fa" stroke="#242249" stroke-width="2.2"/>
    <circle cx="235" cy="116" r="6" fill="none" stroke="#5b5a7d" stroke-width="1.2"/>
    <!-- bielle -->
    <path d="M222 124 208 212M248 124l14 88" stroke="#242249" stroke-width="2.2"/>
    <path d="M235 128v84" stroke="#5b5a7d" stroke-width="0.9" stroke-dasharray="4 4"/>
    <!-- tête de bielle -->
    <circle cx="235" cy="228" r="30" fill="#f7f7fa" stroke="#242249" stroke-width="2.2"/>
    <circle cx="235" cy="228" r="20" fill="none" stroke="#242249" stroke-width="1.2"/>
    <path d="M205 228h60" stroke="#5b5a7d" stroke-width="0.9" stroke-dasharray="4 3"/>
    <!-- renvoi vers la chemise : une cote d'alésage tomberait sur la tête de bielle -->
    <path d="M150 160h-34" stroke="#5b5a7d" stroke-width="0.9"/>
    <text x="40" y="164" font-family="ui-monospace, monospace" font-size="10" fill="#5b5a7d">chemise</text>
    <line x1="235" y1="26" x2="235" y2="268" stroke="#ffae29" stroke-width="0.9" stroke-dasharray="14 4 3 4"/>
  </g>
  <text x="20" y="284" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11"
        letter-spacing="1.4" fill="#5b5a7d">PISTON · BIELLE · CHEMISE</text>
  <line x1="20" y1="270" x2="460" y2="270" stroke="#e3e3ec" stroke-width="1"/>
</svg>
