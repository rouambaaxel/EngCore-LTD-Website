<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Filtre à visser · coupe">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#e3e3ec" stroke-width="1"/>
    </pattern>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#a8a7bd" stroke-width="1"/>
    </pattern>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#ffae29"/>
    </marker>
  </defs>
  <rect width="480" height="300" fill="#f7f7fa"/>
  <rect width="480" height="300" fill="url(#grid)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- corps embouti -->
    <path d="M172 116a68 34 0 0 1 136 0v100H172z" fill="#f7f7fa" stroke="#242249" stroke-width="2.2"/>
    <!-- media plissé, en un seul tracé par côté -->
    <path d="M186 98.0L214 105.6L186 113.2L214 120.8L186 128.4L214 136.0L186 143.6L214 151.2L186 158.8L214 166.4L186 174.0L214 181.6L186 189.2L214 196.8L186 204.4L214 212.0" stroke="#5b5a7d" stroke-width="0.9"/>
    <path d="M294 98.0L266 105.6L294 113.2L266 120.8L294 128.4L266 136.0L294 143.6L266 151.2L294 158.8L266 166.4L294 174.0L266 181.6L294 189.2L266 196.8L294 204.4L266 212.0" stroke="#5b5a7d" stroke-width="0.9"/>
    <path d="M186 96v120M294 96v120M214 96v120M266 96v120" stroke="#5b5a7d" stroke-width="0.9" stroke-dasharray="3 4"/>
    <!-- tube central perforé -->
    <path d="M226 92v124M254 92v124" stroke="#242249" stroke-width="1.2"/>
    <circle cx="240" cy="106" r="3.6" fill="none" stroke="#5b5a7d" stroke-width="0.9"/>
    <circle cx="240" cy="126" r="3.6" fill="none" stroke="#5b5a7d" stroke-width="0.9"/>
    <circle cx="240" cy="146" r="3.6" fill="none" stroke="#5b5a7d" stroke-width="0.9"/>
    <circle cx="240" cy="166" r="3.6" fill="none" stroke="#5b5a7d" stroke-width="0.9"/>
    <circle cx="240" cy="186" r="3.6" fill="none" stroke="#5b5a7d" stroke-width="0.9"/>
    <circle cx="240" cy="206" r="3.6" fill="none" stroke="#5b5a7d" stroke-width="0.9"/>
    <!-- platine filetée -->
    <rect x="166" y="216" width="148" height="24" fill="url(#hatch)" stroke="#242249" stroke-width="2.2"/>
    <path d="M222 240l6-8" stroke="#242249" stroke-width="0.9"/>
    <path d="M231 240l6-8" stroke="#242249" stroke-width="0.9"/>
    <path d="M240 240l6-8" stroke="#242249" stroke-width="0.9"/>
    <path d="M249 240l6-8" stroke="#242249" stroke-width="0.9"/>
    <path d="M258 240l6-8" stroke="#242249" stroke-width="0.9"/>
    <!-- trous d'entrée périphériques -->
    <circle cx="192" cy="228" r="6" fill="#f7f7fa" stroke="#242249" stroke-width="1.2"/>
    <circle cx="288" cy="228" r="6" fill="#f7f7fa" stroke="#242249" stroke-width="1.2"/>
    <!-- joint torique : la pièce qui décide de l'étanchéité -->
    <rect x="160" y="240" width="160" height="11" rx="5.5" fill="#ffae29" stroke="#242249" stroke-width="1.2"/>
    <path d="M320 246h34" stroke="#5b5a7d" stroke-width="0.9"/>
    <text x="358" y="250" font-family="ui-monospace, monospace" font-size="10" fill="#5b5a7d">joint</text>
    <!-- circulation : entrée par la couronne, sortie par le centre.
         Les flèches restent au-dessus du cartouche. -->
    <path d="M192 266v-14" stroke="#ffae29" stroke-width="1.2" marker-end="url(#a)"/>
    <path d="M288 266v-14" stroke="#ffae29" stroke-width="1.2" marker-end="url(#a)"/>
    <path d="M240 252v14" stroke="#ffae29" stroke-width="1.2" marker-end="url(#a)"/>
    <path d="M120 150h44" stroke="#5b5a7d" stroke-width="0.9"/>
    <text x="40" y="154" font-family="ui-monospace, monospace" font-size="10" fill="#5b5a7d">media plissé</text>
    <line x1="240" y1="70" x2="240" y2="240" stroke="#ffae29" stroke-width="0.9" stroke-dasharray="14 4 3 4"/>
  </g>
  <text x="20" y="284" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11"
        letter-spacing="1.4" fill="#5b5a7d">FILTRE À VISSER · COUPE</text>
  <line x1="20" y1="270" x2="460" y2="270" stroke="#e3e3ec" stroke-width="1"/>
</svg>
